name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-progress run finish (don't cancel
# a deploy mid-flight).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Docs import each package's built dist, so build the packages first. Use a
      # path filter (only ./packages/*) so the docs app isn't built here — it has
      # to build last, after the API reference exists, or its /api links are dead.
      - name: Build packages
        run: bun run --filter './packages/*' build
      - name: Generate API reference
        run: bun run --filter='@hopstr/docs' api
      - name: Build static docs
        # DOCS_BASE_PATH makes Vocs emit a full-static site under the repo subpath
        # (https://beamhop.github.io/hopstr/). Runs after the API reference is
        # generated so the /api pages exist and aren't flagged as dead links.
        env:
          DOCS_BASE_PATH: /hopstr
        run: bun run --filter='@hopstr/docs' build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
