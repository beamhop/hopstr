[test]
coverage = true
coverageReporter = ["text", "lcov"]
# Gate on lines + statements (both reliably 100%). Bun's per-function metric is
# unstable for inline closures (counts arrows lcov doesn't), so we don't gate on
# it; lines+statements still fail the run on any genuinely uncovered code.
coverageThreshold = { lines = 1.0 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "**/*.d.ts",
  "src/index.ts",
  "tests/**",
  "dist/**",
  "**/*.types.ts",
  "**/fixtures/**",
  "**/*.csv",
  "**/*.json",
]
