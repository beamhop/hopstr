# This package (like @hopstr/client) triggers Bun 1.3.10's coverage-finalizer
# bug: collecting coverage exits non-zero even with 39/39 tests passing, because
# of its cross-package dist dependency graph (core + signers dists). So coverage
# is OFF by default here — `bun test` is a clean, strict pass/fail gate — and the
# `test:cov` script reports coverage in a separate, non-gating step.
# See packages/core/bunfig.toml and the bun-coverage memory for the full story.
[test]
coverage = false
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "**/*.d.ts",
  "src/index.ts",
  "tests/**",
  "dist/**",
  "**/node_modules/**",
  "**/core/dist/**",
  "**/signers/dist/**",
]
