# See packages/core/bunfig.toml for the lines+statements gating rationale.
[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageThreshold = { lines = 1.0 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "**/*.d.ts",
  "src/index.ts",
  "tests/**",
  "dist/**",
  "**/node_modules/**",
  "**/core/dist/**",
]
