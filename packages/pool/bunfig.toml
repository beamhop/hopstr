[test]
coverage = true
coverageReporter = ["text", "lcov"]
# See packages/core/bunfig.toml: gate on lines+statements (stable), not functions.
coverageThreshold = { lines = 1.0 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "**/*.d.ts",
  "src/index.ts",
  "tests/**",
  "dist/**",
  "**/node_modules/**",
  "**/core/dist/**",
  "**/relay/dist/**",
]
